<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xavier Aquino — Coming Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand+SC&family=Gochi+Hand&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1f3fd1;--paper:#f6f1e3;--flame:#f2553a;--sun:#f7dc5a}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--paper);color:var(--ink);
    font-family:"Patrick Hand SC","Comic Sans MS",cursive;
    display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;
    background-image:radial-gradient(rgba(31,63,209,.18) .8px,transparent 1.2px);
    background-size:14px 14px;
  }
  .banner{
    position:fixed;top:0;left:0;right:0;background:var(--ink);color:var(--paper);
    padding:10px 16px;font-size:1.1rem;letter-spacing:.08em;
  }
  h1{font-family:"Gochi Hand",cursive;font-weight:400;font-size:clamp(3rem,13vw,7.5rem);line-height:.95;margin:0}
  .soon{
    display:inline-block;margin-top:22px;font-size:clamp(1.4rem,5vw,2.2rem);
    background:var(--sun);border:3px solid var(--ink);padding:6px 22px;transform:rotate(-2deg);
    box-shadow:5px 5px 0 var(--flame);
  }
  p{font-size:1.25rem;margin-top:28px;opacity:.85}
</style>
</head>
<body>
  <div class="banner">★ NEW SITE COMING SOON ★</div>
  <main>
    <h1>Xavier Aquino</h1>
    <div class="soon">Coming Soon</div>
    <p>Drawings, sketchbooks &amp; 3D work — on the way.</p>
  </main>
</body>
</html>
